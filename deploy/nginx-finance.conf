# Replace the IPv4 address and certificate paths when using a different host.
server {
    listen 80 default_server;
    server_name 54.83.165.208;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://54.83.165.208$request_uri; }
}
server {
    listen 443 ssl;
    server_name 54.83.165.208;
    ssl_certificate /etc/letsencrypt/live/54.83.165.208/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.83.165.208/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
